[project]
name = "h42-pki"
version = "0.1.0"
description = "Simple very complex PKI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=48.0.0",
    "fastapi[standard]>=0.136.3",
    "pydantic-settings>=2.14.1",
    "tortoise-orm>=1.1.7",
    "typer>=0.26.2",
    "tzdata>=2026.6",
    "uvicorn>=0.54,<0.55",
    "watchfiles>=1.2.0",
]

[project.scripts]
h42pki = "h42pki.cli:app"

[project.optional-dependencies]
pkcs11 = [
    "pykcs11>=1.5.21",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "time-machine>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h42pki"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["h42pki"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not interop' --strict-markers"
markers = [
    "interop: requires external tools / docker",
    "slow: long-running",
]

[tool.coverage.run]
source = ["h42pki"]
branch = true
