[project]
name = "h42-pki"
version = "0.1.0"
description = "Simple very complex PKI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=48.0.0",
    "fastapi[standard]>=0.136.3",
    "granian>=2.8.9",
    "pydantic-settings>=2.14.1",
    "tortoise-orm>=1.1.7",
    "typer>=0.26.2",
    "tzdata>=2026.6",
    "uvicorn>=0.48.0",
]

[project.scripts]
h42pki = "h42pki.cli:app"

[project.optional-dependencies]
pkcs11 = [
    "pykcs11>=1.5.21",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "time-machine>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h42pki"]
